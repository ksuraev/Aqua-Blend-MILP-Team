# .latexindent.yaml
# Run from repo root: latexindent -m -l=.latexindent.yaml -w MILP/docs/formulation.tex

# Don't add extra indent to top-level document/abstract
# (keeps the diff smaller if you're indenting an already-written doc)
noAdditionalIndent:
  document: 1
  abstract: 1

# Align & delimiters in table/matrix-like environments
lookForAlignDelims:
  tabular: 1
  tabularx: 1
  align: 1
  align*: 1
  matrix: 1
  cases: 1

# Trim trailing whitespace on every line after processing
removeTrailingWhitespace:
  beforeProcessing: 0
  afterProcessing: 1

# One sentence per line
modifyLineBreaks:
  oneSentencePerLine:
    manipulateSentences: 1
    sentencesEndWith:
      betterFullStop: 0
      other: |-
        (?x)
        (?:
          (?<!
            (?:
              (?:[eE]\.[gG])
              |
              (?:[iI]\.[eE])
            )
          )
          \.
          \}?
          (?!
            [a-zA-Z0-9-~,]
          )
        )
        |
        (?:
          :
          (?=\s)
        )
